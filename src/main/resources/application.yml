server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: password-vault-backend

  profiles:
    active: postgres # Default profile: postgres (with fallback to dev/h2 if needed)

  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:465}
    username: ${SPRING_MAIL_USERNAME:drajapreinsta@gmail.com}
    password: ${SPRING_MAIL_PASSWORD:dzvxyjvoaumymibj}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: ${SPRING_MAIL_SSL_ENABLE:true}
          starttls:
            enable: ${SPRING_MAIL_STARTTLS_ENABLE:false}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000




  # H2 Fallback Configuration
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/password_vault}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.postgresql.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:tiger}

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # H2 console (disabled - using PostgreSQL)
  h2:
    console:
      enabled: false

app:
  jwt:
    secret: ${APP_JWT_SECRET:9a2f8c4e6b1d3a5f7e8d0c2b4a6f8e1d3c5b7a9f0e2d4c6b8a0f2e4d6c8b0a2f}
    expiration-ms: ${APP_JWT_EXPIRATION_MS:86400000} # 24 hours
